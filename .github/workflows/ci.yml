name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# least privilege for GITHUB_TOKEN (L7 C1)
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Emacs
      uses: purcell/setup-emacs@master
      with:
        version: 29.1
        
    - name: Install Babashka
      uses: babashka/setup-babashka@v1
      with:
        version: 'latest'
        
    - name: Lint Org files
      run: make lint

  # Clojure project in code/ (aygp-dr clojure standard v1)
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: latest
          bb: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ runner.os }}-code-${{ hashFiles('code/deps.edn', 'code/bb.edn') }}
          restore-keys: clj-${{ runner.os }}-code-
      - run: bb check
